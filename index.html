<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi mapa del español · Диагностика EspañolPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--terra:#C65D3B;--terra-d:#A84A2C;--terra-l:#F3D9CC;--indigo:#2E3A6E;--indigo-l:#DDE1F0;--cream:#FBF5EC;--card:#FFFDF9;--ink:#2B2620;--muted:#7A6F63;--line:#E8DDCD;--ok:#2F8F5B;--ok-l:#D8F0E2;--bad:#C0392B;--bad-l:#F8DAD5;--warn:#B7791F;--warn-l:#FCEFD6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Poppins,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:Lora,Georgia,serif;color:var(--indigo);line-height:1.25;margin:0 0 .45em;font-weight:700}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{margin:0 0 .8em}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;min-height:28px}
.brand{font-family:Lora;font-style:italic;color:var(--terra);font-size:1.05rem}
.brand b{color:var(--indigo);font-style:normal}
.sec-label{font-size:.8rem;color:var(--muted);text-align:right}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--terra),#E39A6C);width:0;transition:width .45s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 2px 12px rgba(46,58,110,.05);margin-bottom:16px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:6px}
.muted{color:var(--muted)}.small{font-size:.85rem}
.q{margin:0 0 24px}
.q:last-child{margin-bottom:4px}
.q-title{font-weight:600;margin-bottom:4px}
.q-hint{color:var(--muted);font-size:.84rem;margin-bottom:8px}
.q.err .q-title{color:var(--bad)}
.q.err .opts,.q.err input,.q.err .bip{outline:2px dashed var(--bad-l);outline-offset:4px;border-radius:12px}
.opt-tag{font-size:.72rem;color:var(--muted);font-weight:400;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opts.col{flex-direction:column}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font:inherit;font-size:.93rem;color:var(--ink);text-align:left;transition:.15s;line-height:1.35}
.opt:hover{border-color:#D9B9A6}
.opt.sel{border-color:var(--terra);background:var(--terra-l)}
.opts.col .opt{padding:13px 16px;font-size:1rem}
input[type=text],textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--indigo)}
textarea{min-height:90px;resize:vertical}
.bip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 0 14px}
.bip .l{font-size:.86rem;text-align:right}.bip .r{font-size:.86rem}
.dots{display:flex;gap:6px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;padding:0}
.dot.sel{background:var(--indigo);border-color:var(--indigo)}
.dot:nth-child(3){width:24px;height:24px;margin-top:3px}
.scale10{display:flex;gap:5px;flex-wrap:wrap}
.scale10 .opt{width:42px;text-align:center;padding:9px 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;background:var(--terra);color:#fff;transition:.15s}
.btn:hover{background:var(--terra-d)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--indigo-l)}
.btn.ghost:hover{background:var(--indigo-l)}
.btn.indigo{background:var(--indigo)}.btn.indigo:hover{background:#222c57}
.btn.sm{padding:8px 14px;font-size:.88rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;padding:4px}
.steps{display:grid;gap:10px;margin:16px 0}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--terra-l);color:var(--terra);font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Lora}
.note{background:var(--warn-l);border-radius:12px;padding:12px 14px;font-size:.9rem;margin:12px 0}
.note.blue{background:var(--indigo-l)}
.note.green{background:var(--ok-l)}
/* self assessment */
.sa-group{margin-bottom:22px}
.sa-group h3{display:flex;align-items:center;gap:8px}
.sa-item{border-top:1px solid var(--line);padding:12px 0}
.sa-item p{margin:0 0 8px;font-size:.94rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg .opt{text-align:center;padding:8px 4px;font-size:.82rem}
/* test */
.passage{background:#fff;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-family:Lora;font-size:1.02rem}
.passage .pt{font-family:Poppins;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.audio{display:flex;align-items:center;gap:12px;background:var(--indigo-l);border-radius:12px;padding:12px 14px;margin-bottom:16px;flex-wrap:wrap}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--indigo);color:#fff;font-size:1.3rem;cursor:pointer;flex:0 0 52px}
.play:disabled{opacity:.35;cursor:not-allowed}
.test-q{font-family:Lora;font-size:1.3rem;color:var(--indigo);margin:4px 0 14px}
.test-ins{font-size:.88rem;color:var(--muted)}
.nose{margin-top:10px}
.nose .opt{border-style:dashed;color:var(--muted)}
.nose .opt.sel{color:var(--ink);background:var(--warn-l);border-color:var(--warn)}
.counter{font-size:.82rem;color:var(--muted);margin-top:6px}
/* results */
.hero{text-align:center;padding:30px 20px}
.level-badge{display:inline-block;font-family:Lora;font-size:2.6rem;font-weight:700;color:#fff;background:var(--terra);border-radius:20px;padding:8px 26px;margin:10px 0 6px}
.radar-wrap{display:flex;justify-content:center}
.legend{display:flex;justify-content:center;gap:18px;font-size:.85rem;margin-top:4px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed var(--line);font-size:.94rem}
.list li:last-child{border-bottom:0}
.list li::before{position:absolute;left:0;top:7px;font-weight:700}
.list.plus li::before{content:"✓";color:var(--ok)}
.list.grow li::before{content:"→";color:var(--terra)}
.skillrow{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.sbar{height:10px;background:var(--line);border-radius:99px;position:relative;overflow:visible}
.sbar i{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:var(--terra)}
.sbar b{position:absolute;top:-4px;width:3px;height:18px;background:var(--indigo);border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--indigo-l);color:var(--indigo);border-radius:99px;padding:4px 11px;font-size:.82rem}
.send-status{font-size:.88rem;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:.9rem;transition:.3s;z-index:99;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* oral */
.mode{display:block;width:100%;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.mode:hover{border-color:var(--terra);transform:translateY(-2px)}
.mode-ic{font-size:2.6rem;margin-bottom:6px}
.mode-row{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.mode-row:hover{border-color:var(--terra)}
.oral-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.oral-card .lv{font-size:.75rem;font-weight:700;color:#fff;background:var(--indigo);border-radius:6px;padding:2px 7px;margin-right:6px}
.oral-card .role{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate .opt{font-size:.8rem;padding:6px 10px}
.overlay{position:fixed;inset:0;background:var(--indigo);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;z-index:50;text-align:center}
.overlay h2{color:#fff;font-size:2.2rem}
.overlay p{font-size:1.5rem;max-width:900px;font-family:Lora;line-height:1.45}
.overlay .btn{margin-top:30px}
@media (max-width:600px){
 h1{font-size:1.6rem}.card{padding:18px}
 .two{grid-template-columns:1fr}
 .bip{grid-template-columns:1fr 1fr;gap:6px 14px}
 .bip .dots{order:1;grid-column:1/3;justify-content:space-between}
 .bip .l{order:2;text-align:left;font-size:.8rem}.bip .r{order:3;text-align:right;font-size:.8rem}
 .seg .opt{font-size:.74rem}
 .skillrow{grid-template-columns:92px 1fr 40px;font-size:.82rem}
 .test-q{font-size:1.15rem}
}
@media print{
 body{background:#fff}.nav,.btn,.linkbtn,.top .sec-label,.bar,.noprint{display:none!important}
 .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>

 else if(q.type==='single'||q.type==='multi'){

/* ================== АНАЛИЗ ================== */
function analyze(){
 const st={};LEVELS.forEach(l=>st[l]=stageStats(l));
 const r1=st.A1.ratio,r2=st.A2.ratio,r3=st.B1.ratio;
 let level,levelNote;
 if(r1<.4){level='A0–A1';levelNote='Начальный этап: фундамент только закладывается'}
 else if(r1<PASS_RATIO){level='A1';levelNote='A1 в процессе освоения'}
 else if(!st.A2.reached||r2<.4){level='A1';levelNote='Уверенный A1, впереди переход к A2'}
 else if(r2<PASS_RATIO){level='A1+ / A2';levelNote='A2 в процессе освоения'}
 else if(!st.B1.reached||r3<.4){level='A2';levelNote='Уверенный A2, впереди переход к B1'}
 else if(r3<PASS_RATIO){level='A2+ / B1';levelNote='B1 в процессе освоения'}
 else if(r3<.85){level='B1';levelNote='Уверенный B1'}
 else{level='B1+';levelNote='B1 и выше, стоит проверить уровень B2 на уроке'}
 // навыки по тесту: среднее по уровням A1/A2/B1 (недостигнутые уровни = 0)
 const test={};
 Object.keys(SKILLS).forEach(k=>{let sum=0;LEVELS.forEach(l=>{const its=BANK[l].filter(i=>i.skill===k);const c=its.filter(i=>S.test.res[i.id]&&S.test.res[i.id].ok).length;sum+=its.length?c/its.length:0});test[k]=Math.round(sum/LEVELS.length*100)});
 const selfS={};SELF.forEach(g=>{let s=0;g.items.forEach((_,i)=>s+=(S.self[g.k+i]||0));selfS[g.k]=Math.round(s/9*100)});
 const map={listen:'listen',read:'read',sit:'speak',gram:'gram',vocab:'vocab'};
 const axes=['listen','read','sit','gram','vocab'];
 const gaps=axes.map(k=>selfS[map[k]]-test[k]);
 const avgGap=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
 // темы
 const answered=[];LEVELS.forEach((l,li)=>BANK[l].forEach(it=>{const r=S.test.res[it.id];if(r)answered.push({it,r,li})}));
 const uniq=(arr)=>{const seen=new Set();return arr.filter(x=>{if(seen.has(x.it.topic))return false;seen.add(x.it.topic);return true})};
 const strengths=uniq(answered.filter(x=>x.r.ok).sort((a,b)=>b.li-a.li)).slice(0,3);
 const wrongAll=answered.filter(x=>!x.r.ok).sort((a,b)=>a.li-b.li);
 const growth=uniq(wrongAll).slice(0,3);
 const weakest=axes.slice().sort((a,b)=>test[a]-test[b])[0];
 const strongest=axes.slice().sort((a,b)=>test[b]-test[a])[0];
 return{st,level,levelNote,test,selfS,axes,map,avgGap,gaps,strengths,growth,weakest,strongest,answered,wrongAll};
}

/* ---------- Радар ---------- */
function radar(labels,series){
 const W=440,H=330,cx=220,cy=165,R=112,n=labels.length;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
 let g='';
 [25,50,75,100].forEach(r=>{g+=`<polygon points="${labels.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="${r===100?'#FFFDF9':'none'}" stroke="#E8DDCD" stroke-width="1"/>`});
 labels.forEach((l,i)=>{const[x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E8DDCD"/>`;const[lx,ly]=pt(i,124);const anchor=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-family="Poppins" font-size="13" fill="#2B2620">${l}</text>`});
 series.forEach(s=>{const pts=s.vals.map((v,i)=>pt(i,Math.max(v,3)).join(',')).join(' ');g+=`<polygon points="${pts}" fill="${s.fill}" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="6 5"':''}/>`;s.vals.forEach((v,i)=>{const[x,y]=pt(i,Math.max(v,3));g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${s.color}"/>`})});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:460px" role="img" aria-label="Профиль навыков">${g}</svg>`;
}

function buildOralBlock(){

async function tgSend(text){
 const chunks=[];let cur='';
 for(let line of text.split('\n')){
  while(line.length>3500){if(cur){chunks.push(cur);cur=''}chunks.push(line.slice(0,3500));line=line.slice(3500)}
  if((cur+line+'\n').length>3600){chunks.push(cur);cur=''}
  cur+=line+'\n';
 }
 if(cur.trim())chunks.push(cur);
 for(let i=0;i<chunks.length;i++){
  const body={chat_id:TG_CHAT,text:(chunks.length>1?`[${i+1}/${chunks.length}]\n`:'')+chunks[i],disable_web_page_preview:true};
  const r=await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Telegram '+r.status);
 }
}

 $('#oName').oninput=e=>{o.name=e.target.value;save()};
 $('#oCom').oninput=e=>{o.comment=e.target.value;save()};
 app.querySelectorAll('[data-on]').forEach(el=>el.oninput=()=>{o.notes[el.dataset.on]=el.value;save()});
 app.querySelectorAll('[data-or]').forEach(el=>el.onclick=()=>{const i=el.dataset.or,v=+el.dataset.v;o.rates[i]=o.rates[i]===v?null:v;if(o.rates[i]==null)delete o.rates[i];save();app.querySelectorAll(`[data-or="${i}"]`).forEach(d=>d.classList.toggle('sel',+d.dataset.v===o.rates[i]))});
 app.querySelectorAll('[data-cr]').forEach(el=>el.onclick=()=>{o.crit[el.dataset.cr]=+el.dataset.v;save();app.querySelectorAll(`[data-cr="${el.dataset.cr}"]`).forEach(d=>d.classList.toggle('sel',d===el))});
 app.querySelectorAll('[data-show]').forEach(el=>el.onclick=()=>{const c=ORAL[+el.dataset.show];const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="kicker" style="color:#F3D9CC">${c.lvl} · Situación</div><h2>${esc(c.t)}</h2><p>${esc(c.task)}</p><button class="btn">Закрыть</button>`;ov.querySelector('button').onclick=()=>ov.remove();document.body.appendChild(ov)});
 $('#back').onclick=()=>go('teacher');
 $('#send').onclick=async()=>{
  const box=$('#oStatus');box.textContent='Отправляю…';
  let text;
  if(hasTest)text=buildReport();
  else{const b=buildOralBlock();if(!b){box.textContent='Сначала оцените хотя бы одну карточку.';return}text=['🎤 УСТНАЯ ЧАСТЬ · EspañolPro',`Ученик: ${o.name||'—'}`,`Дата: ${new Date().toLocaleString('ru-RU')}`,'',...b].join('\n')}
  try{await tgSend(text);box.innerHTML='<span style="color:var(--ok)">✓ Отправлено</span>'}catch(e){box.innerHTML='<span style="color:var(--bad)">Не удалось отправить. Скопируйте отчёт на странице результатов.</span>'}
 };
}

/* ================== СТАРТ ================== */
document.getElementById('home').onclick=()=>{stopAudio();if(S.screen==='home')return;if(FLOW.includes(S.screen)){S.resume=S.screen;save()}S.screen='home';render();window.scrollTo(0,0)};
(function init(){
 const saved=loadSaved();
 if(/[?&]teacher/.test(location.search)){withSaved();S.screen='teacher';render();return}
 render();
})();
</script>
